{n:'Ser Proactivo',e:'🥉',c:'#f59e0b',v:'ieIsIFFgI-8',B:'El Guardián de la Proactividad',L:[
['El Despertar','Ser proactivo es tomar la iniciativa y hacerte responsable de tu vida. Entre lo que te pasa y cómo respondes hay un espacio: ahí vive tu libertad de elegir. Nadie más es dueño de tu destino.'],

{n:'Comenzar con un Fin en Mente',e:'🥈',c:'#38bdf8',v:'YxUz45F2a1k',B:'El Arquitecto del Destino',L:[
['La Brújula Interior','Comenzar con un fin en mente es saber a dónde quieres llegar antes de empezar a caminar. Es tener propósito, dirección y una visión clara de lo que quieres lograr. Sin destino, cualquier camino sirve… y ninguno te lleva a ningún lado.'],

['El Plan Maestro','Alinea tus acciones diarias con tus grandes objetivos. Planificar y administrar el tiempo es crear planes y establecer prioridades. Cuidado: de nada sirve subir una escalera si está apoyada en la pared equivocada.'],
['Metas a Corto y Largo Plazo','Corto plazo: metas inmediatas (esta semana, este semestre) que te acercan. Largo plazo: la visión de vida que da dirección. Una visión clara = valores + futuro visualizado + plan.']],

['Una misión personal sirve para…',['Guiar tus decisiones según tus valores','Impresionar a otros','Evitar el esfuerzo'],0],
['Una meta a corto plazo es…',['Tu visión de vida completa','Un objetivo inmediato que te acerca al largo plazo','Una meta imposible'],1],
['Una visión clara se forma con…',['Suerte','Valores + futuro visualizado + plan','Solo dinero'],1],
['La escalera apoyada en la pared equivocada representa…',['Lograr algo que no era lo que querías','Un buen plan','Falta de fuerza'],0],
['Antes de decidir conviene preguntarte…',['¿Qué es más fácil?','¿Qué hacen los demás?','¿Esto me acerca a mi meta?'],2]]},
{n:'Poner Primero lo Primero',e:'🥇',c:'#22c55e',v:'-mhIgaqRyy0',B:'El Señor del Tiempo',L:[
['El Orden del Caos','Poner primero lo primero es hacer lo más importante antes que lo demás. Es establecer prioridades y administrar tu tiempo para equilibrar responsabilidades, metas y ocio. Aquí tu visión se convierte en acción.'],
['La Matriz del Tiempo','Cuatro cuadrantes: I Importante y urgente · II Importante pero no urgente ⭐ · III Urgente pero no importante · IV Ni urgente ni importante. Los efectivos viven en el II: estudiar con tiempo, construir relaciones, desarrollar habilidades, cuidar su salud.'],
['El Poder del No','Piensa en las rocas grandes: si llenas el frasco primero con arena, ya no caben. Decir «sí» a lo importante exige decir «no» a las distracciones. Eso requiere disciplina, autocontrol y límites claros.'],
['La Vida Equilibrada','Procrastinar convierte lo importante en urgente y trae crisis de último minuto. Con un plan semanal tomas decisiones conscientes sobre cómo invertir tu tiempo y energía, con equilibrio entre responsabilidades, metas y descanso.']],
Q:[['¿Qué cuadrante es el de los efectivos?',['Importante pero no urgente','Urgente pero no importante','Ni urgente ni importante'],0],

['Las «rocas grandes» representan…',['Lo importante, que va primero','Las distracciones','El tiempo libre sin plan'],0],
['Procrastinar tareas importantes provoca…',['Más calma','Crisis de último minuto','Mejores notas'],1],
['Decir «no» a una distracción es…',['Perder amigos','Cuidar tus prioridades','Ser aburrido'],1],
['Poner primero lo primero requiere sobre todo…',['Suerte','Disciplina y autocontrol','Más horas en el día'],1]]},
{n:'Pensar en Ganar-Ganar',e:'💎',c:'#a855f7',v:'J9LrzJDRJrw',B:'El Mediador de la Abundancia',L:[
['La Mentalidad de Abundancia','Pensar en ganar-ganar es cultivar la colaboración y buscar soluciones donde todos se benefician. Nace de la abundancia: hay suficiente éxito, reconocimiento y oportunidades para todos.'],
['Ganar-Ganar vs. Ganar-Perder','Ganar-perder: «para que yo gane, tú pierdes» (competir contra todos). Perder-ganar: ceder siempre para caer bien. Ganar-ganar: todos salen beneficiados. El éxito de los demás no es una amenaza para el tuyo.'],
['La Empatía en Acción','Para llegar a un acuerdo ganar-ganar, practica la empatía, escucha activamente y busca soluciones creativas. Valora las opiniones y perspectivas de los demás, aunque sean distintas a las tuyas.'],
['Relaciones de Confianza','En la cuenta bancaria de relaciones haces depósitos (cumplir promesas, ser amable, pedir perdón) y retiros (traicionar, ser egoísta, chismear). Así se construyen la confianza y el respeto mutuo; con buen saldo, los conflictos se resuelven de forma constructiva.']],

['La Escucha Empática','Escucha con los oídos, los ojos y el corazón: no solo las palabras, también el lenguaje corporal y las emociones. Comprende sentimientos, necesidades y perspectivas antes de hablar. Evita interrumpir, aconsejar rápido o preparar tu respuesta mientras el otro habla.'],
['La Base de la Confianza','Cuando alguien se siente comprendido, baja la guardia y te escucha. La empatía y el respeto construyen relaciones sólidas y un ambiente de confianza y colaboración.'],

['El Todo es Mayor que la Suma','Sinergia: 1 + 1 = 3 o más. Combina habilidades en vez de competir y busca la «tercera alternativa»: una solución mejor que la tuya y que la mía, creada entre ambos.'],
['La Diversidad como Fortaleza','Valora las diferencias: cada persona ve el mundo distinto, y eso enriquece las soluciones. Crea un ambiente donde todos se sientan incluidos, escuchados y valorados, y busca soluciones ganar-ganar.'],

['Las 4 dimensiones son…',['Casa, escuela, amigos y trabajo','Cuerpo, mente, corazón y alma','Dinero, fama, poder y éxito'],1],

function fb(e,t){var s=document.createElement('span');s.className=e.className;s.textContent=t;e.replaceWith(s)}
function im(src,cls,t){return'<img class="'+cls+'" src="'+src+'" alt="" onerror="fb(this,\''+t+'\')">'}
function tip(m){return'<div class="tip">'+im(MASC,'mc s','🦬')+'<div><b>Bicente dice:</b> '+m+'</div></div>'}
function xp(){return S.lv.reduce(function(a,l,h){return a+XPL[l]+S.bd[h]*300},0)}
function rank(){var x=xp(),r='';RK.forEach(function(k){if(x>=k[0])r=k[1]});return r}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nb(){return S.bd.reduce(function(a,b){return a+b},0)}
function unl(h){return h==0||S.bd[h-1]==1}
function toast(m){var t=$('ts');t.textContent=m;t.className='on';clearTimeout(window._t);window._t=setTimeout(function(){t.className=''},2600)}
function rs(){S={name:S.name,lv:[0,0,0,0,0,0,0],bd:[0,0,0,0,0,0,0],f1:[1,1,1,1,1,1,1],fin:0,ft:0};sv();map()}
function head(){var x=xp();$('nm').value=S.name;$('xp').textContent=x.toLocaleString()+' / 7000 XP';$('rk').textContent=rank();$('pb').style.width=(x/70)+'%';
 $('bd').innerHTML=H.map(function(h,i){return'<div class="b'+(S.bd[i]?' on':'')+'" title="'+h.n+'">'+h.e+'</div>'}).join('')+'<div class="b'+(S.fin?' on':'')+'" title="Certificación">👑</div>'}
function map(){head();var c=0;while(c<7&&S.bd[c])c++;
 var pts=X.map(function(x,i){return x+','+Y(i)}).join(' '),HT=Y(7)+105;
 var n=H.map(function(h,i){var s=S.bd[i]?'done':unl(i)?'cur':'locked';
  return'<button class="st '+s+'" style="left:'+X[i]+'%;top:'+Y(i)+'px" onclick="go('+i+')">'+(s=='locked'?'🔒':h.e)+(s=='done'?'<span class="ck">✓</span>':'')+'<span class="lb">H'+(i+1)+' · '+h.n+'</span></button>'}).join('');
 var f=nb()==7?(S.fin?'done':'cur'):'locked';
 n+='<button class="st '+f+'" style="left:50%;top:'+Y(7)+'px" onclick="go(7)">'+(f=='locked'?'🔒':'👑')+'<span class="lb">Examen Final · Certificación Oficial</span></button>';
 $('view').innerHTML='<div id="map" style="height:'+HT+'px"><svg viewBox="0 0 100 '+HT+'" preserveAspectRatio="none"><polyline points="'+pts+'"/></svg>'+n+'<div id="tk" style="left:'+X[c]+'%;top:'+Y(c)+'px">'+im(MASC,'mc','🦬')+'</div></div>';scrollTo(0,0)}
function go(i){var ok=i<7?unl(i):nb()==7;if(!ok){toast('🔒 Derrota al jefe del hábito anterior para desbloquear esta estación');return}
 var t=$('tk');t.style.left=X[i]+'%';t.style.top=Y(i)+'px';setTimeout(function(){i<7?stn(i):fin()},950)}
function stn(h){var d=H[h],l=S.lv[h];
 var it=d.L.map(function(x,k){var s=k<l?'done':k==l?'cur':'locked';return'<div class="lvl '+s+'" '+(k<=l?'onclick="lev('+h+','+k+')"':'')+'><div class="n">'+(k<l?'✓':k<=l?k+1:'🔒')+'</div><div><b>Nivel '+(k+1)+' — '+x[0]+'</b><div class="mu">+'+LX[k]+' XP</div></div></div>'}).join('');
 var bs=S.bd[h]?'done':l==4?'cur':'locked';
 it+='<div class="lvl boss '+bs+'" '+(l==4?'onclick="boss('+h+')"':'')+'><div class="n">'+(S.bd[h]?'✓':l==4?'⚔️':'🔒')+'</div><div><b>Jefe — '+d.B+'</b><div class="mu">5 preguntas · 4 aciertos para ganar · +300 XP</div></div></div>';
 $('view').innerHTML='<button class="btn g" onclick="map()">← Mapa</button><div class="card"><div class="mu">ESTACIÓN '+(h+1)+' DE 7 '+d.e+'</div><h2>'+d.n+'</h2>'+tip(T[h])+it+'</div>';head();scrollTo(0,0)}
function lev(h,k){var d=H[h],x=d.L[k],done=k<S.lv[h],v=d.v,vid='';
 if(k==0)vid=v?'<div class="vid"><iframe src="https://www.youtube.com/embed/'+v+'" allowfullscreen title="Video"></iframe></div><p><a href="https://youtu.be/'+v+'" target="_blank" rel="noopener">▶ Ver en YouTube</a></p>':'<div class="ph">🎬 El video de este hábito estará disponible pronto</div>';
 $('view').innerHTML='<button class="btn g" onclick="stn('+h+')">← Volver</button><div class="card"><div class="mu">Hábito '+(h+1)+' · Nivel '+(k+1)+'</div><h2>'+x[0]+'</h2>'+vid+'<p class="tx">'+x[1]+'</p><button class="btn" onclick="'+(done?'stn('+h+')':'pass('+h+')')+'">'+(done?'Volver':'¡Entendido! +'+LX[k]+' XP')+'</button></div>';scrollTo(0,0)}
function pass(h){S.lv[h]++;sv();toast('⭐ +'+LX[S.lv[h]-1]+' XP');stn(h)}
function quiz(items,fb2,end){var i=0,c=0;
 function show(){var q=items[i],o=sh([0,1,2]);
  $('view').innerHTML='<div class="card"><div class="mu">Pregunta '+(i+1)+' de '+items.length+'</div><div class="bar2"><i style="width:'+(i/items.length*100)+'%"></i></div><h3>'+q[0]+'</h3>'+o.map(function(j){return'<button class="o" data-j="'+j+'">'+q[1][j]+'</button>'}).join('')+'<div id="fb"></div></div>';scrollTo(0,0);
  [].forEach.call(document.querySelectorAll('.o'),function(b){b.onclick=function(){var j=+b.dataset.j,ok=j==q[2];if(ok)c++;if(!fb2){nx();return}
   [].forEach.call(document.querySelectorAll('.o'),function(e){e.disabled=true;if(+e.dataset.j==q[2])e.className='o ok'});if(!ok)b.className='o no';
   $('fb').innerHTML='<button class="btn" id="nx">'+(i+1<items.length?'Siguiente →':'Ver resultado')+'</button>';$('nx').onclick=nx}})}
 function nx(){i++;i<items.length?show():end(c)}show()}
function boss(h){var d=H[h];quiz(sh(d.Q).slice(0,5),true,function(c){var w=c>=4;if(w){S.bd[h]=1}else{S.f1[h]=0}sv();head();
 $('view').innerHTML='<div class="card res">'+im(MASC,'mc '+(w?'pop':''),'🦬')+'<h2>'+(w?'¡Jefe derrotado!':'Casi lo logras')+'</h2><p>Acertaste '+c+' de 5.</p>'+(w?'<div class="big pop">'+d.e+'</div><p>Ganaste la insignia <b>'+d.n+'</b> y +300 XP. '+(h<6?'¡Se desbloqueó la siguiente estación!':'¡Ya puedes presentar el Examen Final!')+'</p><button class="btn" onclick="map()">Continuar el viaje</button>':'<p>Necesitas 4 aciertos. Repasa los niveles e inténtalo de nuevo, ¡tú puedes!</p><button class="btn" onclick="boss('+h+')">Reintentar</button><button class="btn g" onclick="stn('+h+')">Repasar</button>')+'</div>'})}
function fin(){if(S.fin)return cert();var w=S.ft-Date.now(),cd=w>0&&!P;
 $('view').innerHTML='<button class="btn g" onclick="map()">← Mapa</button><div class="card"><div class="big">👑</div><h2 style="text-align:center">Examen Final Integrador</h2>'+tip('¡Llegaste a la última estación, manada!')+'<p>35 preguntas (5 por hábito), sin ayudas y sin retroceso. Necesitas 30 de 35 (85%) para obtener tu Certificación Oficial. Si no lo logras, repasa y vuelve a intentarlo en 24 horas.</p>'+(cd?'<div class="msg">Podrás intentarlo de nuevo en '+Math.ceil(w/36e5)+' h. ¡Repasa los hábitos!</div>':'<button class="btn" onclick="exam()">Comenzar examen</button>')+'</div>'}
function exam(){var it=[];H.forEach(function(d){it=it.concat(sh(d.Q).slice(0,5))});quiz(sh(it),false,function(c){
 if(c>=30){S.fin=1;sv();head();cert()}else{S.ft=Date.now()+864e5;sv();$('view').innerHTML='<div class="card res">'+im(MASC,'mc','🦬')+'<h2>Aún no lo logras</h2><p>Acertaste '+c+' de 35 (se requieren 30). Repasa los hábitos y vuelve a intentarlo en 24 horas.</p><button class="btn" onclick="map()">Volver al mapa</button></div>'}})}
function cert(){var hero=S.f1.every(function(x){return x}),d=new Date().toLocaleDateString('es',{year:'numeric',month:'long',day:'numeric'});
 $('view').innerHTML='<div class="cert">'+im(LOGO,'lg','🏫')+'<div class="mu">BIG HORN ACADEMY</div><h2>Certificación Oficial</h2><div class="mu">Se otorga a</div><div class="nm">'+esc(S.name||'Estudiante')+'</div><p>por completar la ruta de los<br><b>7 Hábitos de los Adolescentes Altamente Efectivos</b></p><p style="font-size:1.7rem">'+H.map(function(h){return h.e}).join(' ')+'</p><p><b>Adolescente Altamente Efectivo · '+rank()+'</b></p>'+(hero?'<p>🎁 Logro secreto: <b>El Héroe Interior</b></p>':'')+im(MASC,'mc','🦬').replace('class="mc"','class="mc" style="margin:0 auto"')+'<div class="mu">'+d+'</div></div><p class="noprint" style="text-align:center"><button class="btn" onclick="print()">🖨️ Imprimir / guardar PDF</button><button class="btn g" onclick="map()">← Mapa</button></p>'}
$('lg').src=LOGO;$('nm').addEventListener('input',function(e){S.name=e.target.value;sv()});
map();
</script></body></html>
